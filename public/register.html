<html lang="en">

    <!DOCTYPE html>
<html>
<head>
  <title>Buy | SimpleMart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
  <div class="logo">SimpleMart</div>
  <nav class="menu">
    <a href="home.html">Home</a>
    <a href="buy.html">Buy</a>
    <a href="sell.html">Sell</a>
    <a href="borrow.html">Borrow</a>
    <a href="rent.html">Rent</a>
    <a href="approved.html">Approved</a>
    <a href="profile.html">Profile</a>
  </nav>
</header>

<div class="container">
  <h2>Buy Items</h2>
  <div class="grid" id="items"></div>
</div>

<script>
function loadItems() {
  fetch("http://localhost/simplemart/api/get_items.php?type=buy")
    .then(res => res.json())
    .then(items => {
      let html = "";
      items.forEach(item => {
        html += `
          <div class="item">
            <img src="${item.image}">
            <h3>${item.item_name}</h3>
            <p class="category">${item.category}</p>
            <p class="price">¥${item.price}</p>
            <p class="desc">${item.description}</p>
            <button onclick="buyItem(${item.id})">Buy Now</button>
          </div>`;
      });
      document.getElementById("items").innerHTML = html;
    });
}

function buyItem(id) {
  const fd = new FormData();
  fd.append("buyer_id", 1);
  fd.append("item_id", id);

  fetch("http://localhost/simplemart/api/buy.php", {
    method: "POST",
    body: fd
  })
  .then(res => res.text())
  .then(msg => alert(msg));
}

loadItems();
</script>
</body>
</html>

  </head>
  <body>
    <header class="topbar">
      <div class="logo">SimpleMart</div>
      <nav>
        <a href="index.html">Home</a>
        <a href="buy.html">Buy</a>
        <a href="sell.html">Sell</a>
        <a href="borrow.html">Borrow</a>
        <a href="rent.html">Rent</a>
        <a href="profile.html">Profile</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
      </nav>
    </header>

    <main class="page small-page">
      <section class="card form-card">
        <h1>Create account</h1>
        <form id="register-form">
          <div class="form-grid">
            <label>
              Full name
              <input type="text" name="name" required placeholder="Your name" />
            </label>

            <label>
              Community area
              <input type="text" name="community_area" required placeholder="North Block" />
            </label>

            <label class="full-width">
              Email
              <input type="email" name="email" required placeholder="you@example.com" />
            </label>

            <label class="full-width">
              Password
              <input type="password" name="password" required placeholder="Choose a password" />
            </label>
          </div>
          <div class="item-actions">
            <button class="btn primary" type="submit">Register</button>
            <a class="btn secondary" href="login.html">Already have an account?</a>
          </div>
        </form>
      </section>
    </main>

    <script src="js/auth.js"></script>
  </body>
</html>
